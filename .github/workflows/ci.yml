name: CI

on:
  workflow_dispatch: 

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest

    defaults:
      run:
        working-directory: dss-codec

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: dss-codec -> target

      - name: Build
        run: cargo build --release

      - name: Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: target\release\dss-decode.exe
          retention-days: 7
